[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "supermimic-lab-a3"
version = "0.1.0.dev1"
description = "Optional A3 reference-motion task using the SuperMimic Lab interface"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["supermimic-lab==0.1.0.dev1"]

[project.entry-points."isaaclab.tasks"]
supermimic_a3 = "supermimic_a3"

[tool.setuptools.packages.find]
where = ["src"]
